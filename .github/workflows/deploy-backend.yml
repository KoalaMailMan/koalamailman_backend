name: Backend → Docker Hub → EC2
on:
  push:
    branches: ["infra/nginx-setup"]
  workflow_dispatch:

jobs:
  build_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: 'docker-container'

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest
          no-cache: true


  deploy:
    needs: build_push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest"
            COMPOSE_DIR="$HOME/mandalart/backend"
            ENVFILE="$COMPOSE_DIR/.env"

            if [ ! -d "$COMPOSE_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$COMPOSE_DIR"
            else
              cd "$COMPOSE_DIR" && git pull
            fi

            cat > "$ENVFILE" << "EOF"
            ${{ secrets.BACKEND_ENV_PROD }}
            EOF
            chmod 644 "$ENVFILE"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull "$IMAGE"

            cd "$COMPOSE_DIR"
            docker-compose rm -sf backend 2>/dev/null || true
            BACKEND_IMAGE="$IMAGE" docker-compose up -d

            MAX_RETRIES=60
            SLEEP=10
            COUNT=0
            until docker-compose exec -T backend curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; do
              COUNT=$((COUNT+1))
              if [ $COUNT -ge $MAX_RETRIES ]; then
                echo "Service failed to start after $((MAX_RETRIES*SLEEP)) seconds."
                exit 1
              fi
              echo "Waiting for service... ($COUNT/$MAX_RETRIES)"
              sleep $SLEEP
            done
            echo "Service is up"

            docker image prune -f
            sudo shred -u "$ENVFILE" || sudo rm -f "$ENVFILE"