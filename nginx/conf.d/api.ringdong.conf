server {
    listen 443 ssl;
    server_name api.koreankoala.com;

    ssl_certificate     /etc/letsencrypt/live/api.ringdong.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ringdong.kr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location ~* (eval\(|base64|wget|curl|/tmp|shell|cmd) { return 403; }

    error_page 404 /404.html;
    location = /404.html {
        root /var/www/html;
        internal;
    }

    location = / {
        return 200;
    }

    location /api/recommend/streaming {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_buffering            off;
        proxy_cache                off;
        chunked_transfer_encoding  on;
    }

    location / {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

server {
    listen 80;
    server_name api.ringdong.kr;

    if ($host = api.ringdong.kr) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
